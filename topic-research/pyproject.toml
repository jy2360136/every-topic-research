[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-research"
version = "0.1.0"
description = "从 B站视频字幕自动生成主题学习资料的工作流工具"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "bilibili-api-python>=16.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]